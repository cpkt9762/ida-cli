# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build and Release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7  # stable

      # The library uses the public client without loading IDA. This is not a
      # production runtime: idapro and real-IDB acceptance require a licensed host.
      - name: Prepare fixed public client for isolated library fixtures
        run: |
          timeout 30s python3 -m venv /tmp/nexus-client
          timeout 30s /tmp/nexus-client/bin/python -m pip install --no-deps --require-hashes -r scripts/nexus/requirements.lock
          timeout 30s python3 - <<'PY'
          import pathlib, sys
          sys.path.insert(0, 'scripts')
          from prepare_nexus_env import NEXUS_PATCHES, prepare_source, run
          root = pathlib.Path('/tmp/nexus-ci')
          root.mkdir(mode=0o700)
          (root / 'logs').mkdir()
          source = prepare_source(root)
          for name in NEXUS_PATCHES:
              patch = pathlib.Path('scripts/nexus', name + '.patch').resolve()
              run(root, name + '-check', ['git', 'apply', '--check', str(patch)], cwd=source)
              run(root, name, ['git', 'apply', str(patch)], cwd=source)
          PY
          timeout 30s /tmp/nexus-client/bin/python -m pip install --no-deps --no-build-isolation /tmp/nexus-ci/nexus-source
          echo /tmp/nexus-client/bin >> "$GITHUB_PATH"
          echo IDA_NEXUS_PYTHON=/tmp/nexus-client/bin/python >> "$GITHUB_ENV"
          echo F1_PYTHON=/tmp/nexus-client/bin/python >> "$GITHUB_ENV"

      - name: Validate Rust library tests
        run: |
          timeout 30s cargo check --locked --all-targets
          timeout 30s cargo clippy --locked --all-targets -- -D warnings
          timeout 120s cargo test --locked --lib -- --nocapture

      - name: Validate Python scripts
        run: |
          python3 -m py_compile \
            scripts/decompile_structured.py \
            scripts/run_dbg_test.py \
            scripts/stress_test.py \
            scripts/test_dbg_headless.py \
            scripts/prepare_nexus_env.py \
            scripts/package_release.py

  build-linux:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7  # stable

      - name: Build release binary
        run: timeout 180s cargo build --release --locked --bin ida-cli -vv

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ida-cli-linux-x86_64
          path: target/release/ida-cli

  build-macos:
    needs: validate
    runs-on: macos-14
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7  # stable

      - name: Build release binary
        run: timeout 180s cargo build --release --locked --bin ida-cli

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ida-cli-darwin-arm64
          path: target/release/ida-cli

  release:
    needs: [validate, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: artifacts

      - name: Package release assets
        run: |
          mkdir -p release

          chmod +x artifacts/ida-cli-linux-x86_64/ida-cli artifacts/ida-cli-darwin-arm64/ida-cli
          python3 scripts/package_release.py --binary artifacts/ida-cli-linux-x86_64/ida-cli --output release/ida-cli-Linux_x86_64.tar.gz
          python3 scripts/package_release.py --binary artifacts/ida-cli-darwin-arm64/ida-cli --output release/ida-cli-Darwin_arm64.tar.gz

          cp scripts/install.sh release/install.sh
          chmod +x release/install.sh
          sha256sum release/ida-cli-* > release/sha256sums.txt

      - name: Create release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b  # v2
        with:
          files: |
            release/ida-cli-*.tar.gz
            release/install.sh
            release/sha256sums.txt
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
