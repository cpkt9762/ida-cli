# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build and Release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    # Step budgets total 17 minutes; allow 13 more for checkout/toolchain/network.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7  # stable
        with:
          components: clippy

      # The library uses the public client without loading IDA. This is not a
      # production runtime: idapro and real-IDB acceptance require a licensed host.
      - name: Prepare fixed public client for isolated library fixtures
        run: |
          # Cold Linux venv: 1.21s; >3x margin within this local-only step.
          timeout 30s python3 -m venv /tmp/nexus-client
          # Cold dependency download: 5.04s; allow >3x plus shared-runner network variance.
          timeout 120s /tmp/nexus-client/bin/python -m pip install --no-deps --require-hashes -r scripts/nexus/requirements.lock
          # Offline tree verification and patches: 0.10s; >3x margin.
          timeout 30s python3 - <<'PY'
          import pathlib, sys
          sys.path.insert(0, 'scripts')
          from prepare_nexus_env import NEXUS_PATCHES, prepare_source, run
          root = pathlib.Path('/tmp/nexus-ci')
          root.mkdir(mode=0o700)
          (root / 'logs').mkdir()
          source = prepare_source(root)
          for name in NEXUS_PATCHES:
              patch = pathlib.Path('scripts/nexus', name + '.patch').resolve()
              run(root, name + '-check', ['git', 'apply', '--check', str(patch)], cwd=source)
              run(root, name, ['git', 'apply', str(patch)], cwd=source)
          PY
          # Local client install: 0.24s; >3x margin without a dependency resolver.
          timeout 30s /tmp/nexus-client/bin/python -m pip install --no-deps --no-build-isolation /tmp/nexus-ci/nexus-source
          echo /tmp/nexus-client/bin >> "$GITHUB_PATH"
          echo IDA_NEXUS_PYTHON=/tmp/nexus-client/bin/python >> "$GITHUB_ENV"
          echo F1_PYTHON=/tmp/nexus-client/bin/python >> "$GITHUB_ENV"

      - name: Validate Rust library tests
        run: |
          # Cold stable check on 4 CPUs: 12.08s; >3x for x86_64/shared runners (30s failed there).
          timeout 300s cargo check --locked --all-targets
          # Following cold check: 5.70s; >3x for x86_64/shared runners.
          timeout 180s cargo clippy --locked --all-targets -- -D warnings
          echo 'NOT RUN (requires nexus-test-support and licensed IDA): router::nexus_bridge::final_shutdown_tests::raw_shutdown_waits_for_exact_helper_retirement'
          echo 'NOT RUN (requires nexus-test-support and licensed IDA): router::nexus_bridge::final_shutdown_tests::shutdown_after_bridge_death_retains_untracked_helper_obligation'
          # Cold test build plus library run: 25.62s on 4 CPUs; >3x runner margin.
          timeout 300s cargo test --locked --lib -- --nocapture

      - name: Validate Python scripts
        run: |
          # Six scripts compile in 0.02s; >3x margin and a finite shell bound.
          timeout 30s python3 -m py_compile \
            scripts/decompile_structured.py \
            scripts/run_dbg_test.py \
            scripts/stress_test.py \
            scripts/test_dbg_headless.py \
            scripts/prepare_nexus_env.py \
            scripts/package_release.py

  build-linux:
    needs: validate
    runs-on: ubuntu-latest
    # Ten-minute build budget plus ten minutes for checkout/toolchain/artifact I/O.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7  # stable

      - name: Build release binary
        # Cold stable release on 4 Linux CPUs: 35.65s; >3x x86_64/shared-runner margin.
        run: timeout 600s cargo build --release --locked --bin ida-cli -vv

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ida-cli-linux-x86_64
          path: target/release/ida-cli

  build-macos:
    needs: validate
    # macos-14 is in brownout and retires on 2026-11-02; retain the arm64 runner.
    runs-on: macos-15
    # Ten-minute build budget plus ten minutes for checkout/toolchain/artifact I/O.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7  # stable

      - name: Build release binary
        # macOS has no built-in GNU timeout; use the Actions step deadline.
        # Cold stable release: 31.86s without compiler cache; >3x runner margin.
        timeout-minutes: 10
        run: cargo build --release --locked --bin ida-cli

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ida-cli-darwin-arm64
          path: target/release/ida-cli

  release:
    needs: [validate, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: artifacts

      - name: Package release assets
        run: |
          mkdir -p release

          chmod +x artifacts/ida-cli-linux-x86_64/ida-cli artifacts/ida-cli-darwin-arm64/ida-cli
          python3 scripts/package_release.py --binary artifacts/ida-cli-linux-x86_64/ida-cli --output release/ida-cli-Linux_x86_64.tar.gz
          python3 scripts/package_release.py --binary artifacts/ida-cli-darwin-arm64/ida-cli --output release/ida-cli-Darwin_arm64.tar.gz

          cp scripts/install.sh release/install.sh
          chmod +x release/install.sh
          # Bare file names, so `sha256sum -c sha256sums.txt` works in the download directory.
          (cd release && sha256sum ida-cli-* > sha256sums.txt)

      - name: Create release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b  # v2
        with:
          files: |
            release/ida-cli-*.tar.gz
            release/install.sh
            release/sha256sums.txt
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
