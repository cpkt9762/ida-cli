[package]
name = "ida-cli"
version = "0.2.0"
edition = "2021"
description = "Headless IDA Pro MCP server for AI-assisted binary analysis"
license = "MIT"
repository = "https://github.com/cpkt9762/ida-cli"
authors = ["pingzi"]
keywords = ["ida", "mcp", "reverse-engineering", "disassembly", "decompiler"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "ida_mcp"

[[bin]]
name = "ida-cli"
path = "src/main.rs"

[features]
nexus-test-support = []

[[test]]
name = "nexus_bridge_regressions"
path = "tests/nexus_bridge_regressions.rs"
required-features = ["nexus-test-support"]

[[test]]
name = "nexus_r0_prototypes"
path = "tests/nexus_r0_prototypes.rs"
required-features = ["nexus-test-support"]

[dependencies]
rmcp = { path = "3rd-github/rust-sdk/crates/rmcp", features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "net", "signal", "process", "io-util", "time"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
schemars = "1.2"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
blake3 = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
bytes = "1"
http-body = "1"
http-body-util = "0.1"
tower-service = "0.3"
sha2 = "=0.10.9"

[dev-dependencies]
rstest = "0.25"

[[test]]
name = "nexus_r5"
path = "tests/nexus_r5.rs"
required-features = ["nexus-test-support"]

[[test]]
name = "nexus_r3a"
path = "tests/nexus_r3a.rs"
required-features = ["nexus-test-support"]
